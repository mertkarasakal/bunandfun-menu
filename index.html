<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUN & FUN - Dijital Menü</title>

  <!-- POPPINS & ELYAZISI (ALEX BRUSH) FONTLARI -->
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f0;
      color: #1a221f;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .menu-header {
      text-align: center;
      padding: 25px 20px 10px;
      background: #f5f5f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo {
      max-width: 200px;
      width: 100%;
      height: auto;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .logo-tagline {
      display: block;
      font-family: 'Alex Brush', cursive;
      font-size: 2.2rem;
      color: #172621;
      font-weight: 400;
      text-transform: lowercase;
      letter-spacing: 1px;
      line-height: 1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .back-btn {
      background: #172621;
      color: #d4af37;
      border: 1px solid #172621;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .back-btn:hover { background: #d4af37; color: #172621; }
    .lang-picker-mini { display: flex; gap: 8px; }
    .lang-btn-mini {
      background: #ffffff;
      color: #172621;
      border: 1px solid #172621;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .lang-btn-mini.active { background: #172621; color: #d4af37; border-color: #172621; }

    .container { max-width: 600px; margin: 0 auto; padding: 10px 20px; }

    .welcome-screen {
      text-align: center;
      padding: 20px 10px 30px;
    }
    .welcome-title {
      color: #172621;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    .lang-options-large {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 280px;
      margin: 0 auto;
    }
    .lang-btn-large {
      background: #172621;
      color: #ffffff;
      border: 2px solid #d4af37;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(23, 38, 33, 0.15);
      transition: transform 0.2s, background 0.2s;
    }
    .lang-btn-large:active { transform: scale(0.97); background: #d4af37; color: #172621; }

    .categories-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .category-card {
      background: #ffffff;
      border: 1px solid #e0d5c1;
      border-left: 6px solid #172621;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    .category-card:active { transform: scale(0.98); }
    .category-card-name { font-size: 1.2rem; font-weight: 800; color: #172621; letter-spacing: 1px; }
    .category-card-arrow { color: #d4af37; font-size: 1.4rem; font-weight: bold; }

    .category-header-title {
      color: #172621;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      margin: 10px 0 20px;
      border-bottom: 3px solid #172621;
      padding-bottom: 8px;
    }
    .menu-item {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border: 1px solid #e0d5c1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .item-info { flex: 1; }
    .item-name { font-size: 1.1rem; font-weight: 800; color: #172621; margin-bottom: 5px; }
    .item-desc { font-size: 0.85rem; color: #555555; line-height: 1.4; font-weight: 500; }
    .item-price { font-size: 1.2rem; font-weight: 900; color: #b8860b; white-space: nowrap; }

    .status-msg { text-align: center; padding: 40px; color: #172621; font-weight: 700; font-size: 1.1rem; }
    .hidden { display: none !important; }
  </style>
</head>
