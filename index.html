<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUN & FUN - Dijital Menü</title>
    <!-- Brittany fontu için Google Fonts bağlantısı -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f5f5f0;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #f5f5f0;
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0dc;
        }
        .logo-img {
            max-width: 120px;
            height: auto;
            margin-bottom: 5px;
        }
        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: #d15123;
            margin-top: -5px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex-grow: 1;
        }

        /* Dil Seçim Ekranı */
        #language-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
        }
        .lang-title {
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 600;
            color: #444;
        }
        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }
        .lang-btn {
            background-color: #ffffff;
            border: 2px solid #d15123;
            color: #d15123;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .lang-btn:hover {
            background-color: #d15123;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Menü Ekranları */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .back-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #d15123;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #222;
        }

        /* Kategori Kartları */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .category-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            border-left: 5px solid #d15123;
        }
        .category-card:hover {
            transform: scale(1.01);
        }

        /* Ürün Listesi */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .product-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #ddd;
        }
        .product-info {
            flex-grow: 1;
        }
        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 4px;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #d15123;
        }

        /* Ürün Detay Modal (Açılır Ekran) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #eee;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-img {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #ddd;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .modal-price {
            font-size: 20px;
            font-weight: 700;
            color: #d15123;
        }
    </style>
</head>
<body>

    <header>
        <!-- Gönderdiğin logo görselinin dosya adını buraya yazmalısın (örn: logo.png) -->
        <img src="logo.png" alt="BUN & FUN Logo" class="logo-img">
        <div class="slogan">fun in every bite</div>
    </header>

    <div class="container">
        
        <!-- 1. DİL SEÇİM EKRANI -->
        <div id="language-screen" class="screen active">
            <div class="lang-title">Lütfen Dil Seçiniz / Please Select Language / Выберите язык</div>
            <div class="lang-buttons">
                <button class="lang-btn" onclick="setLanguage('tr')">Türkçe</button>
                <button class="lang-btn" onclick="setLanguage('en')">English</button>
                <button class="lang-btn" onclick="setLanguage('ru')">Русский</button>
            </div>
        </div>

        <!-- 2. KATEGORİLER EKRANI -->
        <div id="categories-screen" class="screen">
            <div class="back-bar">
                <button class="back-btn" onclick="goBackToLanguages()">← <span id="txt-change-lang">Dil Değiştir</span></button>
            </div>
            <div class="section-title" id="txt-categories-title">Kategoriler</div>
            <div class="category-grid" id="category-container">
                <!-- Kategoriler JavaScript ile dinamik eklenecek -->
            </div>
        </div>

        <!-- 3. ÜRÜN LİSTESİ EKRANI -->
        <div id="products-screen" class="screen">
            <div class="back-bar">
                <button class="back-btn" onclick="goBackToCategories()">← <span id="txt-back-cat">Kategoriler</span></button>
            </div>
            <div class="section-title" id="product-section-title">Ürünler</div>
            <div class="product-list" id="product-container">
                <!-- Ürünler JavaScript ile dinamik eklenecek -->
            </div>
        </div>

    </div>

    <!-- 4. ÜRÜN DETAY MODALI (POPUP) -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <!-- Görselin olmadığı durumda varsayılan bir yer tutucu veya ürün görseli çıkacak -->
            <img id="modal-img" src="" alt="Ürün Görseli" class="modal-img">
            <h3 id="modal-title" class="modal-title">Ürün Adı</h3>
            <p id="modal-desc" class="modal-desc">Ürün açıklaması burada yer alacak.</p>
            <div id="modal-price" class="modal-price">00 TL</div>
        </div>
    </div>

    <script>
        // Google Sheets verilerini buraya simüle ediyoruz veya entegre ediyoruz.
        // Üç dilde verilerin yapısı:
        const menuData = {
            tr: {
                categoriesTitle: "Kategoriler",
                changeLang: "Dil Değiştir",
                backCat: "Kategoriler",
                categories: [
                    {
                        id: "burgerler",
                        name: "Burgerler",
                        products: [
                            { name: "Classic Burger", desc: "150 gr dana köfte, cheddar, karamelize soğan,özel sos.", price: "240 TL", image: "" },
                            { name: "Smokey Fun Burger", desc: "Füme kaburga, cheddar peyniri, barbekü sos ve çıtır soğan.", price: "290 TL", image: "" }
                        ]
                    },
                    {
                        id: "icecekler",
                        name: "İçecekler",
                        products: [
                            { name: "Ev Yapımı Soğukçay", desc: "Taze şeftali aromalı ev yapımı soğuk çay.", price: "70 TL", image: "" },
                            { name: "Limonata", desc: "Nane ve taze limon dilimleriyle.", price: "75 TL", image: "" }
                        ]
                    }
                ]
            },
            en: {
                categoriesTitle: "Categories",
                changeLang: "Change Language",
                backCat: "Categories",
                categories: [
                    {
                        id: "burgerler",
                        name: "Burgers",
                        products: [
                            { name: "Classic Burger", desc: "150g beef patty, cheddar, caramelized onions, special sauce.", price: "240 TL", image: "" },
                            { name: "Smokey Fun Burger", desc: "Smoked beef ribs, cheddar cheese, BBQ sauce and crispy onions.", price: "290 TL", image: "" }
                        ]
                    },
                    {
                        id: "icecekler",
                        name: "Beverages",
                        products: [
                            { name: "Homemade Iced Tea", desc: "Fresh peach flavored homemade iced tea.", price: "70 TL", image: "" },
                            { name: "Lemonade", desc: "With mint and fresh lemon slices.", price: "75 TL", image: "" }
                        ]
                    }
                ]
            },
            ru: {
                categoriesTitle: "Категории",
                changeLang: "Сменить язык",
                backCat: "Категории",
                categories: [
                    {
                        id: "burgerler",
                        name: "Бургеры",
                        products: [
                            { name: "Классический бургер", desc: "Говяжья котлета 150г, чеддер, карамелизованный лук, фирменный соус.", price: "240 TL", image: "" },
                            { name: "Smokey Fun Бургер", desc: "Копченая говядина, сыр чеддер, соус барбекю и хрустящий лук.", price: "290 TL", image: "" }
                        ]
                    },
                    {
                        id: "icecekler",
                        name: "Напитки",
                        products: [
                            { name: "Домашний холодный чай", desc: "Домашний холодный чай со вкусом свежего персика.", price: "70 TL", image: "" },
                            { name: "Лимонад", desc: "С мятой и свежими ломтиками лимона.", price: "75 TL", image: "" }
                        ]
                    }
                ]
            }
        };

        let currentLang = 'tr';
        let currentCategoryIndex = null;

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('language-screen').classList.remove('active');
            document.getElementById('categories-screen').classList.add('active');
            
            // Dil metinlerini güncelle
            document.getElementById('txt-change-lang').innerText = menuData[lang].changeLang;
            document.getElementById('txt-categories-title').innerText = menuData[lang].categoriesTitle;
            document.getElementById('txt-back-cat').innerText = menuData[lang].backCat;

            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            menuData[currentLang].categories.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `<span>${cat.name}</span> <span>→</span>`;
                card.onclick = () => openCategory(index);
                container.appendChild(card);
            });
        }

        function openCategory(index) {
            currentCategoryIndex = index;
            document.getElementById('categories-screen').classList.remove('active');
            document.getElementById('products-screen').classList.add('active');

            const cat = menuData[currentLang].categories[index];
            document.getElementById('product-section-title').innerText = cat.name;

            const container = document.getElementById('product-container');
            container.innerHTML = '';

            cat.products.forEach((prod) => {
                const pCard = document.createElement('div');
                pCard.className = 'product-card';
                // Görsel henüz yoksa gri boş kutu gösterir, görsel eklendiğinde otomatik alır
                const imgSrc = prod.image ? prod.image : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="%23ccc" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>';
                
                pCard.innerHTML = `
                    <img src="${imgSrc}" class="product-thumb" alt="${prod.name}">
                    <div class="product-info">
                        <div class="product-name">${prod.name}</div>
                        <div class="product-price">${prod.price}</div>
                    </div>
                `;
                pCard.onclick = () => openProductModal(prod);
                container.appendChild(pCard);
            });
        }

        function openProductModal(prod) {
            const modal = document.getElementById('product-modal');
            const imgSrc = prod.image ? prod.image : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 24 24" fill="none" stroke="%23ccc" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>';
            
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('modal-title').innerText = prod.name;
            document.getElementById('modal-desc').innerText = prod.desc;
            document.getElementById('modal-price').innerText = prod.price;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        function goBackToLanguages() {
            document.getElementById('categories-screen').classList.remove('active');
            document.getElementById('language-screen').classList.add('active');
        }

        function goBackToCategories() {
            document.getElementById('products-screen').classList.remove('active');
            document.getElementById('categories-screen').classList.add('active');
        }
    </script>
</body>
</html>
