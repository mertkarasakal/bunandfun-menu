<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUN & FUN - Dijital Menü</title>

  <!-- POPPINS & ELYAZISI (ALEX BRUSH) FONTLARI -->
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* TÜM SİTE ARKA PLANI: #f5f5f0 */
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f0;
      color: #1a221f;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* HEADER ALANI VE LOGO DÜZENLEMESİ */
    .menu-header {
      text-align: center;
      padding: 25px 20px 10px;
      background: #f5f5f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ORİJİNAL LOGO GÖRSELİ */
    .brand-logo {
      max-width: 200px;
      width: 100%;
      height: auto;
      object-fit: contain;
      margin-bottom: 8px;
    }

    /* BRITTANY STİLİ EL YAZISI SLOGAN */
    .logo-tagline {
      display: block;
      font-family: 'Alex Brush', cursive;
      font-size: 2.2rem;
      color: #172621;
      font-weight: 400;
      text-transform: lowercase;
      letter-spacing: 1px;
      line-height: 1;
    }

    /* ÜST MİNİ BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .back-btn {
      background: #172621;
      color: #d4af37;
      border: 1px solid #172621;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .back-btn:hover { background: #d4af37; color: #172621; }
    .lang-picker-mini { display: flex; gap: 8px; }
    .lang-btn-mini {
      background: #ffffff;
      color: #172621;
      border: 1px solid #172621;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .lang-btn-mini.active { background: #172621; color: #d4af37; border-color: #172621; }

    /* İÇERİK KONTEYNERİ */
    .container { max-width: 600px; margin: 0 auto; padding: 10px 20px; }

    /* 1. AÇILIŞ DİL SEÇİM SAYFASI */
    .welcome-screen {
      text-align: center;
      padding: 20px 10px 30px;
    }
    .welcome-title {
      color: #172621;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    .lang-options-large {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 280px;
      margin: 0 auto;
    }
    .lang-btn-large {
      background: #172621;
      color: #ffffff;
      border: 2px solid #d4af37;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(23, 38, 33, 0.15);
      transition: transform 0.2s, background 0.2s;
    }
    .lang-btn-large:active { transform: scale(0.97); background: #d4af37; color: #172621; }

    /* 2. KATEGORİ KARTLARI SAYFASI */
    .categories-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .category-card {
      background: #ffffff;
      border: 1px solid #e0d5c1;
      border-left: 6px solid #172621;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    .category-card:active { transform: scale(0.98); }
    .category-card-name { font-size: 1.2rem; font-weight: 800; color: #172621; letter-spacing: 1px; }
    .category-card-arrow { color: #d4af37; font-size: 1.4rem; font-weight: bold; }

    /* 3. ÜRÜN LİSTESİ SAYFASI */
    .category-header-title {
      color: #172621;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      margin: 10px 0 20px;
      border-bottom: 3px solid #172621;
      padding-bottom: 8px;
    }
    .menu-item {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border: 1px solid #e0d5c1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .item-info { flex: 1; }
    .item-name { font-size: 1.1rem; font-weight: 800; color: #172621; margin-bottom: 5px; }
    .item-desc { font-size: 0.85rem; color: #555555; line-height: 1.4; font-weight: 500; }
    .item-price { font-size: 1.2rem; font-weight: 900; color: #b8860b; white-space: nowrap; }

    .status-msg { text-align: center; padding: 40px; color: #172621; font-weight: 700; font-size: 1.1rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- HEADER / LOGO VE SLOGAN -->
  <header class="menu-header">
    <img src="Gemini_Generated_Image_qtkeltqtkeltqtke_2.jpg" alt="BUN & FUN Logo" class="brand-logo">
    <span class="logo-tagline">fun in every bite</span>
  </header>

  <!-- ÜST BAR: GERİ DÖN VE DİL SEÇİMİ -->
  <div id="top-bar" class="top-bar hidden">
    <button id="back-btn" class="back-btn" onclick="goBack()">← Dili Değiştir</button>
    <div class="lang-picker-mini">
      <button class="lang-btn-mini" id="mini-TR" onclick="setLanguage('TR')">TR</button>
      <button class="lang-btn-mini" id="mini-EN" onclick="setLanguage('EN')">EN</button>
      <button class="lang-btn-mini" id="mini-RU" onclick="setLanguage('RU')">RU</button>
    </div>
  </div>

  <main class="container">
    
    <!-- EKRAN 1: DİL SEÇİMİ -->
    <section id="screen-welcome" class="welcome-screen">
      <div class="welcome-title">Lütfen Dil Seçiniz / Select Language</div>
      <div class="lang-options-large">
        <button class="lang-btn-large" onclick="selectInitialLanguage('TR')">Türkçe 🇹🇷</button>
        <button class="lang-btn-large" onclick="selectInitialLanguage('EN')">English 🇬🇧</button>
        <button class="lang-btn-large" onclick="selectInitialLanguage('RU')">Русский 🇷🇺</button>
      </div>
    </section>

    <!-- EKRAN 2: KATEGORİ LİSTESİ -->
    <section id="screen-categories" class="hidden">
      <div id="categories-list" class="categories-grid"></div>
    </section>

    <!-- EKRAN 3: ÜRÜN LİSTESİ -->
    <section id="screen-products" class="hidden">
      <h2 id="selected-category-title" class="category-header-title"></h2>
      <div id="products-list"></div>
    </section>

    <div id="status-msg" class="status-msg hidden">Yükleniyor...</div>

  </main>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSdNmjIQYSsH6Wt1yluSA7KvQhyUhJCpPXB8PKPH2sLF-fxe-vfhGCdw0KVzmWVquyIvcg8iIE_KZa9/pub?gid=0&single=true&output=csv';

    let currentLang = 'TR';
    let currentView = 'welcome';
    let activeCategory = '';
    let rawRows = [];

    function parseCSVLine(text) {
      let p = '', c = '', r = [];
      let q = false;
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        if (c === '"') { q = !q; }
        else if ((c === ',' || c === ';') && !q) { r.push(p.trim().replace(/^"|"$/g, '')); p = ''; }
        else { p += c; }
      }
      r.push(p.trim().replace(/^"|"$/g, ''));
      return r;
    }

    async function fetchMenu() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const text = await response.text();
        const lines = text.split('\n');

        rawRows = [];
        for (let i = 1; i < lines.length; i++) {
          if (lines[i].trim()) {
            rawRows.push(parseCSVLine(lines[i]));
          }
        }
      } catch (err) {
        showStatus("❌ Veriler çekilemedi. Bağlantınızı kontrol edin.");
      }
    }

    function selectInitialLanguage(lang) {
      currentLang = lang;
      updateMiniLangButtons();
      showCategoriesScreen();
    }

    function setLanguage(lang) {
      currentLang = lang;
      updateMiniLangButtons();
      if (currentView === 'categories') {
        renderCategories();
      } else if (currentView === 'products') {
        renderProducts(activeCategory);
      }
    }

    function updateMiniLangButtons() {
      document.querySelectorAll('.lang-btn-mini').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('mini-' + currentLang);
      if(activeBtn) activeBtn.classList.add('active');
    }

    function showCategoriesScreen() {
      currentView = 'categories';
      document.getElementById('screen-welcome').classList.add('hidden');
      document.getElementById('screen-products').classList.add('hidden');
      document.getElementById('screen-categories').classList.remove('hidden');
      document.getElementById('top-bar').classList.remove('hidden');
      
      document.getElementById('back-btn').innerText = getBackText();
      renderCategories();
    }

    function showProductsScreen(categoryName) {
      currentView = 'products';
      activeCategory = categoryName;
      document.getElementById('screen-categories').classList.add('hidden');
      document.getElementById('screen-products').classList.remove('hidden');
      
      document.getElementById('back-btn').innerText = getBackCategoryText();
      renderProducts(categoryName);
    }

    function goBack() {
      if (currentView === 'products') {
        showCategoriesScreen();
      } else if (currentView === 'categories') {
        currentView = 'welcome';
        document.getElementById('screen-categories').classList.add('hidden');
        document.getElementById('top-bar').classList.add('hidden');
        document.getElementById('screen-welcome').classList.remove('hidden');
      }
    }

    function getBackText() {
      if(currentLang === 'EN') return '← Languages';
      if(currentLang === 'RU') return '← Языки';
      return '← Diller';
    }

    function getBackCategoryText() {
      if(currentLang === 'EN') return '← Categories';
      if(currentLang === 'RU') return '← Категории';
      return '← Kategoriler';
    }

    function getVal(row, index) {
      return (row && row[index] !== undefined && row[index] !== null) ? row[index].trim() : '';
    }

    function getProcessedData() {
      const categoriesMap = {};

      rawRows.forEach(row => {
        const status = getVal(row, 4);
        if (status.toLowerCase().includes('satışta')) {
          let catTR = getVal(row, 0);
          let nameTR = getVal(row, 1);
          let descTR = getVal(row, 2);
          let price = getVal(row, 3);

          let cat = catTR;
          let name = nameTR;
          let desc = descTR;

          if (currentLang === 'EN') {
            cat = getVal(row, 6) || catTR;
            name = getVal(row, 7) || nameTR;
            desc = getVal(row, 8) || descTR;
          } else if (currentLang === 'RU') {
            cat = getVal(row, 9) || catTR;
            name = getVal(row, 10) || nameTR;
            desc = getVal(row, 11) || descTR;
          }

          if (cat) {
            if (!categoriesMap[cat]) categoriesMap[cat] = [];
            categoriesMap[cat].push({ name, desc, price });
          }
        }
      });
      return categoriesMap;
    }

    function renderCategories() {
      const container = document.getElementById('categories-list');
      container.innerHTML = '';
      const data = getProcessedData();

      const catKeys = Object.keys(data);

      if (catKeys.length === 0) {
        container.innerHTML = '<div class="status-msg">Bu dilde kategori bulunamadı.</div>';
        return;
      }

      catKeys.forEach(catName => {
        const card = document.createElement('div');
        card.className = 'category-card';
        card.onclick = () => showProductsScreen(catName);
        card.innerHTML = `
          <span class="category-card-name">${catName}</span>
          <span class="category-card-arrow">→</span>
        `;
        container.appendChild(card);
      });
    }

    function renderProducts(catName) {
      document.getElementById('selected-category-title').innerText = catName;
      const container = document.getElementById('products-list');
      container.innerHTML = '';
      
      const data = getProcessedData();
      const items = data[catName] || [];

      items.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'menu-item';
        itemDiv.innerHTML = `
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
          </div>
          <div class="item-price">${item.price} ₺</div>
        `;
        container.appendChild(itemDiv);
      });
    }

    function showStatus(msg) {
      const statusDiv = document.getElementById('status-msg');
      statusDiv.innerHTML = msg;
      statusDiv.classList.remove('hidden');
    }

    fetchMenu();
  </script>
</body>
</html>
