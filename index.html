<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUN & FUN - Dijital Menü</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* ÖZEL TEMA RENKLERİ: KOYU YEŞİL & ALTIN SARISI */
    body {
      font-family: 'Poppins', sans-serif;
      background: #0B1310; /* Derin Koyu Yeşil Zemin */
      color: #FFFFFF;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* HEADER & LOGO ALANI */
    .menu-header {
      text-align: center;
      padding: 35px 20px 20px;
      background: linear-gradient(180deg, #040806 0%, #0B1310 100%);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }
    .logo-title {
      font-size: 2.6rem;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 3px;
      line-height: 1;
      text-transform: uppercase;
    }
    .logo-title .ampersand { color: #D4AF37; }
    .logo-tagline {
      display: block;
      font-size: 1rem;
      color: #D4AF37;
      letter-spacing: 2px;
      margin-top: 6px;
      font-weight: 400;
      text-transform: lowercase;
    }

    /* DİL SEÇİM ÜST MİNİ BAR (Kategoriye Girildiğinde Görünür) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .back-btn {
      background: rgba(212, 175, 55, 0.1);
      color: #D4AF37;
      border: 1px solid #D4AF37;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .back-btn:hover { background: #D4AF37; color: #000; }
    .lang-picker-mini { display: flex; gap: 8px; }
    .lang-btn-mini {
      background: #14201C;
      color: #AAA;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .lang-btn-mini.active { background: #D4AF37; color: #000; font-weight: 800; }

    /* İÇERİK KONTEYNERİ */
    .container { max-width: 600px; margin: 0 auto; padding: 10px 20px; }

    /* 1. AÇILIŞ DİL SEÇİM SAYFASI */
    .welcome-screen {
      text-align: center;
      padding: 40px 10px;
    }
    .welcome-title {
      color: #D4AF37;
      font-size: 1.2rem;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    .lang-options-large {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 280px;
      margin: 0 auto;
    }
    .lang-btn-large {
      background: #14201C;
      color: #FFFFFF;
      border: 2px solid #D4AF37;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s, background 0.2s;
    }
    .lang-btn-large:active { transform: scale(0.97); background: #D4AF37; color: #000; }

    /* 2. KATEGORİ KARTLARI SAYFASI */
    .categories-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .category-card {
      background: linear-gradient(135deg, #14201C 0%, #0E1815 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: 5px solid #D4AF37;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .category-card:active { transform: scale(0.98); }
    .category-card-name { font-size: 1.2rem; font-weight: 800; color: #FFFFFF; letter-spacing: 1px; }
    .category-card-arrow { color: #D4AF37; font-size: 1.4rem; font-weight: bold; }

    /* 3. ÜRÜN LİSTESİ SAYFASI */
    .category-header-title {
      color: #D4AF37;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      margin: 10px 0 20px;
      border-bottom: 2px solid #D4AF37;
      padding-bottom: 8px;
    }
    .menu-item {
      background: #14201C;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .item-info { flex: 1; }
    .item-name { font-size: 1.1rem; font-weight: 700; color: #FFFFFF; margin-bottom: 5px; }
    .item-desc { font-size: 0.85rem; color: #B0B8B5; line-height: 1.4; }
    .item-price { font-size: 1.15rem; font-weight: 800; color: #D4AF37; white-space: nowrap; }

    .status-msg { text-align: center; padding: 40px; color: #D4AF37; font-size: 1.1rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- HEADER / LOGO -->
  <header class="menu-header">
    <div class="logo-container">
      <h1 class="logo-title">BUN<span class="ampersand">&</span>FUN</h1>
      <span class="logo-tagline">fun in every bite</span>
    </div>
  </header>

  <!-- ÜST BAR: GERİ DÖN VE HIZLI DİL SEÇİMİ (Kategoriler veya Ürünler Ekranında Çıkar) -->
  <div id="top-bar" class="top-bar hidden">
    <button id="back-btn" class="back-btn" onclick="goBack()">← Dili Değiştir</button>
    <div class="lang-picker-mini">
      <button class="lang-btn-mini" id="mini-TR" onclick="setLanguage('TR')">TR</button>
      <button class="lang-btn-mini" id="mini-EN" onclick="setLanguage('EN')">EN</button>
      <button class="lang-btn-mini" id="mini-RU" onclick="setLanguage('RU')">RU</button>
    </div>
  </div>

  <main class="container">
    
    <!-- EKRAN 1: DİL SEÇİMİ -->
    <section id="screen-welcome" class="welcome-screen">
      <div class="welcome-title">Lütfen Dil Seçiniz / Select Language</div>
      <div class="lang-options-large">
        <button class="lang-btn-large" onclick="selectInitialLanguage('TR')">Türkçe 🇹🇷</button>
        <button class="lang-btn-large" onclick="selectInitialLanguage('EN')">English 🇬🇧</button>
        <button class="lang-btn-large" onclick="selectInitialLanguage('RU')">Русский 🇷🇺</button>
      </div>
    </section>

    <!-- EKRAN 2: KATEGORİ LİSTESİ -->
    <section id="screen-categories" class="hidden">
      <div id="categories-list" class="categories-grid"></div>
    </section>

    <!-- EKRAN 3: ÜRÜN LİSTESİ -->
    <section id="screen-products" class="hidden">
      <h2 id="selected-category-title" class="category-header-title"></h2>
      <div id="products-list"></div>
    </section>

    <!-- YÜKLENİYOR / HATA DURUMU -->
    <div id="status-msg" class="status-msg hidden">Yükleniyor...</div>

  </main>

  <script>
    // GOOGLE SHEETS CSV LİNKİNİ AŞAĞIDAKİ ALANA YAPIŞTIRIN:
    const SHEET_CSV_URL = 'BURAYA_GOOGLE_SHEETS_CSV_LINKINI_YAPISTIRIN';

    let currentLang = 'TR';
    let currentView = 'welcome'; // 'welcome', 'categories', 'products'
    let activeCategory = '';
    let rawRows = [];

    function parseCSVLine(text) {
      let p = '', c = '', r = [];
      let q = false;
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        if (c === '"') { q = !q; }
        else if ((c === ',' || c === ';') && !q) { r.push(p.trim().replace(/^"|"$/g, '')); p = ''; }
        else { p += c; }
      }
      r.push(p.trim().replace(/^"|"$/g, ''));
      return r;
    }

    async function fetchMenu() {
      if (!SHEET_CSV_URL || SHEET_CSV_URL.includes('BURAYA_GOOGLE')) {
        showStatus("⚠️ Lütfen SHEET_CSV_URL alanına Google Tablo CSV linkinizi ekleyin.");
        return;
      }
      try {
        const response = await fetch(SHEET_CSV_URL);
        const text = await response.text();
        const lines = text.split('\n');

        rawRows = [];
        for (let i = 1; i < lines.length; i++) {
          if (lines[i].trim()) {
            rawRows.push(parseCSVLine(lines[i]));
          }
        }
      } catch (err) {
        showStatus("❌ Veriler çekilemedi. Bağlantıyı kontrol edin.");
      }
    }

    /* AKIŞ VE DİL YÖNETİMİ */
    function selectInitialLanguage(lang) {
      currentLang = lang;
      updateMiniLangButtons();
      showCategoriesScreen();
    }

    function setLanguage(lang) {
      currentLang = lang;
      updateMiniLangButtons();
      if (currentView === 'categories') {
        renderCategories();
      } else if (currentView === 'products') {
        renderProducts(activeCategory);
      }
    }

    function updateMiniLangButtons() {
      document.querySelectorAll('.lang-btn-mini').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('mini-' + currentLang);
      if(activeBtn) activeBtn.classList.add('active');
    }

    /* EKRAN GEÇİŞLERİ */
    function showCategoriesScreen() {
      currentView = 'categories';
      document.getElementById('screen-welcome').classList.add('hidden');
      document.getElementById('screen-products').classList.add('hidden');
      document.getElementById('screen-categories').classList.remove('hidden');
      document.getElementById('top-bar').classList.remove('hidden');
      
      document.getElementById('back-btn').innerText = getBackText();
      renderCategories();
    }

    function showProductsScreen(categoryName) {
      currentView = 'products';
      activeCategory = categoryName;
      document.getElementById('screen-categories').classList.add('hidden');
      document.getElementById('screen-products').classList.remove('hidden');
      
      document.getElementById('back-btn').innerText = getBackCategoryText();
      renderProducts(categoryName);
    }

    function goBack() {
      if (currentView === 'products') {
        showCategoriesScreen();
      } else if (currentView === 'categories') {
        currentView = 'welcome';
        document.getElementById('screen-categories').classList.add('hidden');
        document.getElementById('top-bar').classList.add('hidden');
        document.getElementById('screen-welcome').classList.remove('hidden');
      }
    }

    function getBackText() {
      if(currentLang === 'EN') return '← Languages';
      if(currentLang === 'RU') return '← Языки';
      return '← Diller';
    }

    function getBackCategoryText() {
      if(currentLang === 'EN') return '← Categories';
      if(currentLang === 'RU') return '← Категории';
      return '← Kategoriler';
    }

    /* RENDER (EKRANA BASMA) İŞLEMLERİ */
    function getProcessedData() {
      const categoriesMap = {};

      rawRows.forEach(row => {
        const status = row[4] || '';
        if (status.toLowerCase().includes('satışta')) {
          let cat = row[0] || '';
          let name = row[1] || '';
          let desc = row[2] || '';
          let price = row[3] || '';

          if (currentLang === 'EN') {
            cat = row[6] || cat;
            name = row[7] || name;
            desc = row[8] || desc;
          } else if (currentLang === 'RU') {
            cat = row[9] || cat;
            name = row[10] || name;
            desc = row[11] || desc;
          }

          if (!categoriesMap[cat]) categoriesMap[cat] = [];
          categoriesMap[cat].push({ name, desc, price });
        }
      });
      return categoriesMap;
    }

    function renderCategories() {
      const container = document.getElementById('categories-list');
      container.innerHTML = '';
      const data = getProcessedData();

      Object.keys(data).forEach(catName => {
        const card = document.createElement('div');
        card.className = 'category-card';
        card.onclick = () => showProductsScreen(catName);
        card.innerHTML = `
          <span class="category-card-name">${catName}</span>
          <span class="category-card-arrow">→</span>
        `;
        container.appendChild(card);
      });
    }

    function renderProducts(catName) {
      document.getElementById('selected-category-title').innerText = catName;
      const container = document.getElementById('products-list');
      container.innerHTML = '';
      
      const data = getProcessedData();
      const items = data[catName] || [];

      items.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'menu-item';
        itemDiv.innerHTML = `
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
          </div>
          <div class="item-price">${item.price} ₺</div>
        `;
        container.appendChild(itemDiv);
      });
    }

    function showStatus(msg) {
      const statusDiv = document.getElementById('status-msg');
      statusDiv.innerHTML = msg;
      statusDiv.classList.remove('hidden');
    }

    // Başlat
    fetchMenu();
  </script>
</body>
</html>
