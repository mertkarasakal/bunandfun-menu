<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUN & FUN - Dijital Menü</title>
    <!-- Brittany / El yazısı fontu ve Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f5f5f0;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #f5f5f0;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0dc;
        }
        .header-brand {
            font-size: 28px;
            font-weight: 700;
            color: #c73729;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: #ee8e00;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex-grow: 1;
        }

        /* Sayfa Yönetimi */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* Dil Seçim Ekranı */
        #page-language {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }
        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }
        .lang-btn {
            background-color: #ffffff;
            border: 2px solid #c73729;
            color: #c73729;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .lang-btn span.flag {
            font-size: 22px;
        }
        .lang-btn:hover {
            background-color: #c73729;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Geri Tuşu Alanı */
        .back-bar {
            margin-bottom: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #c73729;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #222;
        }

        /* Kategori Kartları */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .category-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            border-left: 5px solid #c73729;
        }
        .category-card:hover {
            transform: scale(1.01);
        }

        /* Ürün Listesi */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .product-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 11px;
            text-align: center;
            border: 1px dashed #ccc;
            flex-shrink: 0;
        }
        .product-info {
            flex-grow: 1;
        }
        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 4px;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #c73729;
        }

        /* Tekil Ürün Detay Sayfası */
        .detail-box {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .detail-img {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            background-color: #eee;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .detail-title {
            font-size: 22px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }
        .detail-desc {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .detail-price {
            font-size: 24px;
            font-weight: 700;
            color: #c73729;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">BUN & FUN BURGER</div>
        <div class="slogan">fun in every bite</div>
    </header>

    <div class="container">
        
        <!-- SAYFA 1: DİL SEÇİMİ -->
        <div id="page-language" class="page active">
            <div class="lang-buttons">
                <button class="lang-btn" onclick="selectLanguage('tr')">
                    <span class="flag">🇹🇷</span> Türkçe
                </button>
                <button class="lang-btn" onclick="selectLanguage('en')">
                    <span class="flag">🇬🇧</span> English
                </button>
                <button class="lang-btn" onclick="selectLanguage('ru')">
                    <span class="flag">🇷🇺</span> Русский
                </button>
            </div>
        </div>

        <!-- SAYFA 2: KATEGORİLER -->
        <div id="page-categories" class="page">
            <div class="back-bar">
                <button class="back-btn" onclick="goToPage('page-language')">← <span id="txt-back-lang">Dil Seçimi</span></button>
            </div>
            <div class="section-title" id="txt-cat-title">Kategoriler</div>
            <div class="category-grid" id="category-container"></div>
        </div>

        <!-- SAYFA 3: ÜRÜN LİSTESİ -->
        <div id="page-products" class="page">
            <div class="back-bar">
                <button class="back-btn" onclick="goToPage('page-categories')">← <span id="txt-back-cat">Kategoriler</span></button>
            </div>
            <div class="section-title" id="product-section-title">Ürünler</div>
            <div class="product-list" id="product-container"></div>
        </div>

        <!-- SAYFA 4: TEKİL ÜRÜN DETAY SAYFASI -->
        <div id="page-detail" class="page">
            <div class="back-bar">
                <button class="back-btn" onclick="goToPage('page-products')">← <span id="txt-back-prod">Ürünlere Dön</span></button>
            </div>
            <div class="detail-box">
                <div class="detail-img">[ Ürün Görseli Yakında ]</div>
                <h2 id="detail-title" class="detail-title">Ürün Adı</h2>
                <p id="detail-desc" class="detail-desc">Açıklama</p>
                <div id="detail-price" class="detail-price">0 TL</div>
            </div>
        </div>

    </div>

    <script>
        // Eksiksiz ürünler ve kategoriler (Tatlılar çıkarıldı, tüm diller eklendi)
        const menuData = {
            tr: {
                backLang: "Dil Seçimi",
                backCat: "Kategoriler",
                backProd: "Ürünlere Dön",
                catTitle: "Kategoriler",
                categories: [
                    {
                        name: "Burgerler",

                            { name: "Classic Burger", desc: "150 gr dana köfte, cheddar, karamelize soğan, özel sos.", price: "240 TL" },
                            { name: "Cheeseburger", desc: "Bol cheddar peyniri ve özel burger sosu ile.", price: "260 TL" },
                            { name: "Smokey Fun Burger", desc: "Füme kaburga, cheddar peyniri, barbekü sos ve çıtır soğan.", price: "290 TL" },
                            { name: "Double Trouble Burger", desc: "Çift kat dana köfte, çift cheddar ve özel sos.", price: "340 TL" },
                            { name: "Truffle Mushroom Burger", desc: "Trüf mantarlı özel sos, karamelize soğan ve cheddar.", price: "310 TL" },
                            { name: "Crispy Chicken Burger", desc: "Çıtır pane tavuk göğsü, marul veözel burger sos.", price: "250 TL" }
                        ]
                    },
                    {
                        name: "Atıştırmalıklar & Yan Ürünler",
                        products: [
                            { name: "Patates Kızartması", desc: "Özel baharatlı çıtır patates kızartması.", price: "90 TL" },
                            { name: "Soğan Halkaları", desc: "Çıtır kaplamalı soğan halkaları (8 adet).", price: "100 TL" },
                            { name: "Çıtır Tavuk Parçaları", desc: "Özel sos eşliğinde pane tavuk lokmaları.", price: "140 TL" },
                            { name: "Mozzarella Sticks", desc: "Çıtır kaplamalı uzayan mozzarella peynirleri.", price: "130 TL" }
                        ]
                    },
                    {
                        name: "İçecekler",
                        products: [
                            { name: "Ev Yapımı Soğukçay", desc: "Taze şeftali aromalı ev yapımı soğuk çay.", price: "70 TL" },
                            { name: "Limonata", desc: "Nane ve taze limon dilimleriyle.", price: "75 TL" },
                            { name: "Kola / Gazlı İçecekler", desc: "Soğuk servis edilir.", price: "60 TL" },
                            { name: "Su", desc: "500 ml cam şişe.", price: "30 TL" },
                            { name: "Ayran", desc: "Bol köpüklü yayık ayranı.", price: "40 TL" }
                        ]
                    }
                ]
            },
            en: {
                backLang: "Language",
                backCat: "Categories",
                backProd: "Back to Products",
                catTitle: "Categories",
                categories: [
                    {
                        name: "Burgers",
                        products: [
                            { name: "Classic Burger", desc: "150g beef patty, cheddar, caramelized onions, special sauce.", price: "240 TL" },
                            { name: "Cheeseburger", desc: "With plenty of cheddar cheese and special burger sauce.", price: "260 TL" },
                            { name: "Smokey Fun Burger", desc: "Smoked beef ribs, cheddar cheese, BBQ sauce and crispy onions.", price: "290 TL" },
                            { name: "Double Trouble Burger", desc: "Double beef patty, double cheddar and special sauce.", price: "340 TL" },
                            { name: "Truffle Mushroom Burger", desc: "Truffle mushroom special sauce, caramelized onions and cheddar.", price: "310 TL" },
                            { name: "Crispy Chicken Burger", desc: "Crispy breaded chicken breast, lettuce and special burger sauce.", price: "250 TL" }
                        ]
                    },
                    {
                        name: "Sides & Appetizers",
                        products: [
                            { name: "French Fries", desc: "Crispy french fries with special spices.", price: "90 TL" },
                            { name: "Onion Rings", desc: "Crispy coated onion rings (8 pcs).", price: "100 TL" },
                            { name: "Crispy Chicken Bites", desc: "Breaded chicken nuggets served with special sauce.", price: "140 TL" },
                            { name: "Mozzarella Sticks", desc: "Crispy coated stretchy mozzarella cheese sticks.", price: "130 TL" }
                        ]
                    },
                    {
                        name: "Beverages",
                        products: [
                            { name: "Homemade Iced Tea", desc: "Fresh peach flavored homemade iced tea.", price: "70 TL" },
                            { name: "Lemonade", desc: "With mint and fresh lemon slices.", price: "75 TL" },
                            { name: "Cola / Soft Drinks", desc: "Served cold.", price: "60 TL" },
                            { name: "Water", desc: "500 ml glass bottle.", price: "30 TL" },
                            { name: "Ayran", desc: "Traditional frothy yogurt drink.", price: "40 TL" }
                        ]
                    }
                ]
            },
            ru: {
                backLang: "Язык",
                backCat: "Категории",
                backProd: "Назад к товарам",
                catTitle: "Категории",
                categories: [
                    {
                        name: "Бургеры",
                        products: [
                            { name: "Классический бургер", desc: "Говяжья котлета 150г, чеддер, карамелизованный лук, фирменный соус.", price: "240 TL" },
                            { name: "Чизбургер", desc: "С большим количеством сыра чеддер и фирменным соусом.", price: "260 TL" },
                            { name: "Smokey Fun Бургер", desc: "Копченая говядина, сыр чеддер, соус барбекю и хрустящий лук.", price: "290 TL" },
                            { name: "Двойной бургер", desc: "Двойная говяжья котлета, двойной чеддер и фирменный соус.", price: "340 TL" },
                            { name: "Трюфельный бургер с грибами", desc: "Фирменный трюфельный соус, карамелизованный лук и сыр чеддер.", price: "310 TL" },
                            { name: "Куриный бургер", desc: "Хрустящая куриная грудка, салат айсберг и фирменный соус.", price: "250 TL" }
                        ]
                    },
                    {
                        name: "Закуски",
                        products: [
                            { name: "Картофель фри", desc: "Хрустящий картофель фри со специями.", price: "90 TL" },
                            { name: "Луковые кольца", desc: "Хрустящие луковые кольца (8 шт).", price: "100 TL" },
                            { name: "Куриные наггетсы", desc: "Кусочки курицы в панировке с фирменным соусом.", price: "140 TL" },
                            { name: "Моцарелла стicks", desc: "Хрустящие палочки из сыра моцарелла.", price: "130 TL" }
                        ]
                    },
                    {
                        name: "Напитки",
                        products: [
                            { name: "Домашний холодный чай", desc: "Домашний холодный чай со вкусом свежего персика.", price: "70 TL" },
                            { name: "Лимонад", desc: "С мятой и свежими ломтиками лимона.", price: "75 TL" },
                            { name: "Кола / Газировка", desc: "Подается холодным.", price: "60 TL" },
                            { name: "Вода", desc: "Стеклянная бутылка 500 мл.", price: "30 TL" },
                            { name: "Айран", desc: "Традиционный кисломолочный напиток.", price: "40 TL" }
                        ]
                    }
                ]
            }
        };

        let currentLang = 'tr';

        function goToPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function selectLanguage(lang) {
            currentLang = lang;
            
            document.getElementById('txt-back-lang').innerText = menuData[lang].backLang;
            document.getElementById('txt-back-cat').innerText = menuData[lang].backCat;
            document.getElementById('txt-back-prod').innerText = menuData[lang].backProd;
            document.getElementById('txt-cat-title').innerText = menuData[lang].catTitle;

            renderCategories();
            goToPage('page-categories');
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            menuData[currentLang].categories.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `<span>${cat.name}</span> <span>→</span>`;
                card.onclick = () => openCategory(index);
                container.appendChild(card);
            });
        }

        function openCategory(catIndex) {
            const cat = menuData[currentLang].categories[catIndex];
            document.getElementById('product-section-title').innerText = cat.name;

            const container = document.getElementById('product-container');
            container.innerHTML = '';

            cat.products.forEach((prod) => {
                const pCard = document.createElement('div');
                pCard.className = 'product-card';
                pCard.innerHTML = `
                    <div class="product-thumb">Görsel Yok</div>
                    <div class="product-info">
                        <div class="product-name">${prod.name}</div>
                        <div class="product-price">${prod.price}</div>
                    </div>
                `;
                pCard.onclick = () => openProductDetail(prod);
                container.appendChild(pCard);
            });

            goToPage('page-products');
        }

        function openProductDetail(prod) {
            document.getElementById('detail-title').innerText = prod.name;
            document.getElementById('detail-desc').innerText = prod.desc;
            document.getElementById('detail-price').innerText = prod.price;

            goToPage('page-detail');
        }
    </script>
</body>
</html>
