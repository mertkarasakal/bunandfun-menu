<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUN & FUN - Dijital Menü</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0f1715;
      color: #ffffff;
      padding-bottom: 50px;
    }

    /* HEADER & LOGO */
    .menu-header {
      text-align: center;
      padding: 35px 15px 20px;
      background: linear-gradient(180deg, #050a08 0%, #0f1715 100%);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .logo-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 3px;
      line-height: 1;
      text-transform: uppercase;
    }

    .logo-title .ampersand {
      color: #d4af37;
    }

    .logo-tagline {
      display: block;
      font-size: 1.1rem;
      color: #d4af37;
      letter-spacing: 2px;
      margin-top: 8px;
      font-weight: 400;
    }

    /* DİL SEÇİMİ */
    .lang-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 10px;
    }

    .lang-btn {
      background: #1a2622;
      color: #cccccc;
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .lang-btn.active, .lang-btn:hover {
      background: #d4af37;
      color: #000000;
    }

    /* MENÜ İÇERİK */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .category-title {
      color: #d4af37;
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      margin: 30px 0 15px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 5px;
      letter-spacing: 1px;
    }

    .menu-item {
      background: #16221f;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 0.85rem;
      color: #aaaaaa;
      line-height: 1.4;
    }

    .item-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: #d4af37;
      white-space: nowrap;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #d4af37;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- HEADER / LOGO AREA -->
  <header class="menu-header">
    <div class="logo-container">
      <h1 class="logo-title">BUN<span class="ampersand">&</span>FUN</h1>
      <span class="logo-tagline">fun in every bite</span>
    </div>

    <!-- LANGUAGE BUTTONS -->
    <div class="lang-picker">
      <button class="lang-btn active" onclick="changeLanguage('TR')">TR</button>
      <button class="lang-btn" onclick="changeLanguage('EN')">EN</button>
      <button class="lang-btn" onclick="changeLanguage('RU')">RU</button>
    </div>
  </header>

  <!-- MENU CONTAINER -->
  <main class="container" id="menu-container">
    <div class="loading">Menü Yükleniyor...</div>
  </main>

  <script>
    // GOOGLE SHEETS CSV LINKINI BURAYA YAPIŞTIRIN
    const SHEET_CSV_URL = 'BURAYA_GOOGLE_SHEETS_CSV_LINKINI_YAPISTIRIN';

    let currentLang = 'TR';
    let menuData = [];

    // CSV Parse Fonksiyonu
    function parseCSV(text) {
      const lines = text.split('\n');
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(col => col.replace(/^"|"$/g, '').trim());
        result.push(row);
      }
      return result;
    }

    // Google Tablo Verilerini Çekme
    async function fetchMenu() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        menuData = rows.map(row => ({
          catTR: row[0] || '',
          nameTR: row[1] || '',
          descTR: row[2] || '',
          price: row[3] || '',
          status: row[4] || '',
          catEN: row[6] || row[0] || '',
          nameEN: row[7] || row[1] || '',
          descEN: row[8] || row[2] || '',
          catRU: row[9] || row[0] || '',
          nameRU: row[10] || row[1] || '',
          descRU: row[11] || row[2] || ''
        }));

        renderMenu();
      } catch (err) {
        document.getElementById('menu-container').innerHTML = '<div class="loading">Menü yüklenirken hata oluştu.</div>';
      }
    }

    // Dili Değiştirme
    function changeLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === lang);
      });
      renderMenu();
    }

    // Ekrana Basma
    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const activeItems = menuData.filter(item => item.status.toLowerCase().includes('satışta'));

      const categories = {};
      activeItems.forEach(item => {
        let cat = item.catTR;
        let name = item.nameTR;
        let desc = item.descTR;

        if (currentLang === 'EN') {
          cat = item.catEN;
          name = item.nameEN;
          desc = item.descEN;
        } else if (currentLang === 'RU') {
          cat = item.catRU;
          name = item.nameRU;
          desc = item.descRU;
        }

        if (!categories[cat]) categories[cat] = [];
        categories[cat].push({ name, desc, price: item.price });
      });

      for (const [category, items] of Object.entries(categories)) {
        const catHeader = document.createElement('h2');
        catHeader.className = 'category-title';
        catHeader.innerText = category;
        container.appendChild(catHeader);

        items.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'menu-item';
          itemDiv.innerHTML = `
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-desc">${item.desc}</div>
            </div>
            <div class="item-price">${item.price} ₺</div>
          `;
          container.appendChild(itemDiv);
        });
      }
    }

    fetchMenu();
  </script>
</body>
</html>
