<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUN & FUN - Dijital Menü</title>
    <!-- Brittany / El yazısı fontu ve Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f5f5f0;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #f5f5f0;
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0dc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        /* Header Logo Tasarımı */
        .header-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #c73729;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            background-color: #fff;
        }
        .header-brand {
            font-size: 26px;
            font-weight: 700;
            color: #c73729;
            letter-spacing: 1px;
            margin-bottom: 0px;
        }
        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 24px;
            color: #ee8e00;
            margin-top: -4px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex-grow: 1;
        }

        /* Sayfa Yönetimi */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* 1. Dil Seçim Ekranı */
        #page-language {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }
        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }
        .lang-btn {
            background-color: #ffffff;
            border: 2px solid #c73729;
            color: #c73729;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .lang-btn span.flag {
            font-size: 22px;
        }
        .lang-btn:hover {
            background-color: #c73729;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Geri Tuşu */
        .back-bar {
            margin-bottom: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #c73729;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #222;
        }

        /* Kategori Listesi */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .category-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            border-left: 5px solid #c73729;
        }
        .category-card:hover {
            transform: scale(1.01);
        }

        /* Ürün Listesi */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .product-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 11px;
            text-align: center;
            flex-shrink: 0;
        }
        .product-info {
            flex-grow: 1;
        }
        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 2px;
        }
        .product-desc-preview {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #c73729;
        }

        /* Tekil Ürün Detay Sayfası */
        .detail-box {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .detail-img {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .detail-title {
            font-size: 22px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }
        .detail-desc {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .detail-price {
            font-size: 24px;
            font-weight: 700;
            color: #c73729;
        }
    </style>
</head>
