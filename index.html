<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUN & FUN - Dijital Menü</title>
    <!-- Brittany / El yazısı fontu ve Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f5f5f0;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #f5f5f0;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0dc;
        }
        .header-brand {
            font-size: 28px;
            font-weight: 700;
            color: #c73729;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: #ee8e00;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex-grow: 1;
        }

        /* Dil Seçim Ekranı */
        #language-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
        }
        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }
        .lang-btn {
            background-color: #ffffff;
            border: 2px solid #c73729;
            color: #c73729;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .lang-btn span.flag {
            font-size: 22px;
        }
        .lang-btn:hover {
            background-color: #c73729;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Menü Ekranları */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .back-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #c73729;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #222;
        }

        /* Kategori Kartları */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .category-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            border-left: 5px solid #c73729;
        }
        .category-card:hover {
            transform: scale(1.01);
        }

        /* Ürün Listesi */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .product-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 11px;
            text-align: center;
            border: 1px dashed #ccc;
            flex-shrink: 0;
        }
        .product-info {
            flex-grow: 1;
        }
        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 4px;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #c73729;
        }

        /* Ürün Detay Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #eee;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-img {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #eee;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .modal-price {
            font-size: 20px;
            font-weight: 700;
            color: #c73729;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">BUN & FUN BURGER</div>
        <div class="slogan">fun in every bite</div>
    </header>

    <div class="container">
        
        <!-- 1. DİL SEÇİM EKRANI -->
        <div id="language-screen" class="screen active">
            <div class="lang-buttons">
                <button class="lang-btn" onclick="setLanguage('tr')">
                    <span class="flag">🇹🇷</span> Türkçe
                </button>
                <button class="lang-btn" onclick="setLanguage('en')">
                    <span class="flag">🇬🇧</span> English
                </button>
                <button class="lang-btn" onclick="setLanguage('ru')">
                    <span class="flag">🇷🇺</span> Русский
                </button>
            </div>
        </div>

        <!-- 2. KATEGORİLER EKRANI -->
        <div id="categories-screen" class="screen">
            <div class="back-bar">
                <button class="back-btn" onclick="goBackToLanguages()">← <span id="txt-change-lang">Dil Seçimi</span></button>
            </div>
            <div class="section-title" id="txt-categories-title">Kategoriler</div>
            <div class="category-grid" id="category-container"></div>
        </div>

        <!-- 3. ÜRÜN LİSTESİ EKRANI -->
        <div id="products-screen" class="screen">
            <div class="back-bar">
                <button class="back-btn" onclick="goBackToCategories()">← <span id="txt-back-cat">Kategoriler</span></button>
            </div>
            <div class="section-title" id="product-section-title">Ürünler</div>
            <div class="product-list" id="product-container"></div>
        </div>

    </div>

    <!-- 4. ÜRÜN DETAY MODALI -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div id="modal-img-container" style="width:100%; height:200px; background:#eee; border-radius:12px; margin-bottom:15px; display:flex; align-items:center; justify-content:center; color:#888; font-size:13px; border:1px dashed #ccc;">
                [ Ürün Görseli Yakında ]
            </div>
            <h3 id="modal-title" class="modal-title">Ürün Adı</h3>
            <p id="modal-desc" class="modal-desc">Ürün açıklaması burada yer alacak.</p>
            <div id="modal-price" class="modal-price">00 TL</div>
        </div>
    </div>

    <script>
        // Tablonuzdaki tüm kategoriler ve 3 dildeki içerikler tam olarak entegre edilmiştir:
        const menuData = {
            tr: {
                categoriesTitle: "Kategoriler",
                changeLang: "Dil Seçimi",
                backCat: "Kategoriler",
                categories: [
                    {
                        name: "Burgerler",
                        products: [
                            { name: "Classic Burger", desc: "150 gr dana köfte, cheddar, karamelize soğan, özel sos.", price: "240 TL" },
                            { name: "Cheeseburger", desc: "Bol cheddar peyniri ve özel burger sosu ile.", price: "260 TL" },
                            { name: "Smokey Fun Burger", desc: "Füme kaburga, cheddar peyniri, barbekü sos ve çıtır soğan.", price: "290 TL" },
                            { name: "Double Trouble Burger", desc: "Çift kat dana köfte, çift cheddar ve özel sos.", price: "340 TL" }
                        ]
                    },
                    {
                        name: "Atıştırmalıklar & Yan Ürünler",
                        products: [
                            { name: "Patates Kızartması", desc: "Özel baharatlı çıtır patates kızartması.", price: "90 TL" },
                            { name: "Soğan Halkaları", desc: "Çıtır kaplamalı soğan halkaları (8 adet).", price: "100 TL" },
                            { name: "Çıtır Tavuk Parçaları", desc: "Özel sos eşliğinde pane tavuk lokmaları.", price: "140 TL" }
                        ]
                    },
                    {
                        name: "Tatlılar",
                        products: [
                            { name: "Sufle", desc: "Akışkan çikolatalı ev yapımı sıcak sufle.", price: "120 TL" },
                            { name: "Cheesecake", desc: "Frambuaz soslu enfes New York cheesecake.", price: "130 TL" }
                        ]
                    },
                    {
                        name: "İçecekler",
                        products: [
                            { name: "Ev Yapımı Soğukçay", desc: "Taze şeftali aromalı ev yapımı soğuk çay.", price: "70 TL" },
                            { name: "Limonata", desc: "Nane ve taze limon dilimleriyle.", price: "75 TL" },
                            { name: "Kola / Gazlı İçecekler", desc: "Soğuk servis edilir.", price: "60 TL" },
                            { name: "Su", desc: "500 ml cam şişe.", price: "30 TL" }
                        ]
                    }
                ]
            },
            en: {
                categoriesTitle: "Categories",
                changeLang: "Language",
                backCat: "Categories",
                categories: [
                    {
                        name: "Burgers",
                        products: [
                            { name: "Classic Burger", desc: "150g beef patty, cheddar, caramelized onions, special sauce.", price: "240 TL" },
                            { name: "Cheeseburger", desc: "With plenty of cheddar cheese and special burger sauce.", price: "260 TL" },
                            { name: "Smokey Fun Burger", desc: "Smoked beef ribs, cheddar cheese, BBQ sauce and crispy onions.", price: "290 TL" },
                            { name: "Double Trouble Burger", desc: "Double beef patty, double cheddar and special sauce.", price: "340 TL" }
                        ]
                    },
                    {
                        name: "Sides & Appetizers",
                        products: [
                            { name: "French Fries", desc: "Crispy french fries with special spices.", price: "90 TL" },
                            { name: "Onion Rings", desc: "Crispy coated onion rings (8 pcs).", price: "100 TL" },
                            { name: "Crispy Chicken Bites", desc: "Breaded chicken nuggets served with special sauce.", price: "140 TL" }
                        ]
                    },
                    {
                        name: "Desserts",
                        products: [
                            { name: "Souffle", desc: "Warm homemade souffle with flowing chocolate.", price: "120 TL" },
                            { name: "Cheesecake", desc: "Delicious New York cheesecake with raspberry sauce.", price: "130 TL" }
                        ]
                    },
                    {
                        name: "Beverages",
                        products: [
                            { name: "Homemade Iced Tea", desc: "Fresh peach flavored homemade iced tea.", price: "70 TL" },
                            { name: "Lemonade", desc: "With mint and fresh lemon slices.", price: "75 TL" },
                            { name: "Cola / Soft Drinks", desc: "Served cold.", price: "60 TL" },
                            { name: "Water", desc: "500 ml glass bottle.", price: "30 TL" }
                        ]
                    }
                ]
            },
            ru: {
                categoriesTitle: "Категории",
                changeLang: "Язык",
                backCat: "Категории",
                categories: [
                    {
                        name: "Бургеры",
                        products: [
                            { name: "Классический бургер", desc: "Говяжья котлета 150г, чеддер, карамелизованный лук, фирменный соус.", price: "240 TL" },
                            { name: "Чизбургер", desc: "С большим количеством сыра чеддер и фирменным соусом.", price: "260 TL" },
                            { name: "Smokey Fun Бургер", desc: "Копченая говядина, сыр чеддер, соус барбекю и хрустящий лук.", price: "290 TL" },
                            { name: "Двойной бургер", desc: "Двойная говяжья котлета, двойной чеддер и фирменный соус.", price: "340 TL" }
                        ]
                    },
                    {
                        name: "Закуски",
                        products: [
                            { name: "Картофель фри", desc: "Хрустящий картофель фри со специями.", price: "90 TL" },
                            { name: "Луковые кольца", desc: "Хрустящие луковые кольца (8 шт).", price: "100 TL" },
                            { name: "Куриные наггетсы", desc: "Кусочки курицы в панировке с фирменным соусом.", price: "140 TL" }
                        ]
                    },
                    {
                        name: "Десерты",
                        products: [
                            { name: "Суфле", desc: "Теплое домашнее суфле с жидким шоколадом.", price: "120 TL" },
                            { name: "Чизкейк", desc: "Вкуснейший нью-йоркский чизкейк с малиновым соусом.", price: "130 TL" }
                        ]
                    },
                    {
                        name: "Напитки",
                        products: [
                            { name: "Домашний холодный чай", desc: "Домашний холодный чай со вкусом свежего персика.", price: "70 TL" },
                            { name: "Лимонад", desc: "С мятой и свежими ломтиками лимона.", price: "75 TL" },
                            { name: "Кола / Газировка", desc: "Подается холодным.", price: "60 TL" },
                            { name: "Вода", desc: "Стеклянная бутылка 500 мл.", price: "30 TL" }
                        ]
                    }
                ]
            }
        };

        let currentLang = 'tr';

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('language-screen').classList.remove('active');
            document.getElementById('categories-screen').classList.add('active');
            
            document.getElementById('txt-change-lang').innerText = menuData[lang].changeLang;
            document.getElementById('txt-categories-title').innerText = menuData[lang].categoriesTitle;
            document.getElementById('txt-back-cat').innerText = menuData[lang].backCat;

            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            menuData[currentLang].categories.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `<span>${cat.name}</span> <span>→</span>`;
                card.onclick = () => openCategory(index);
                container.appendChild(card);
            });
        }

        function openCategory(index) {
            document.getElementById('categories-screen').classList.remove('active');
            document.getElementById('products-screen').classList.add('active');

            const cat = menuData[currentLang].categories[index];
            document.getElementById('product-section-title').innerText = cat.name;

            const container = document.getElementById('product-container');
            container.innerHTML = '';

            cat.products.forEach((prod) => {
                const pCard = document.createElement('div');
                pCard.className = 'product-card';
                
                pCard.innerHTML = `
                    <div class="product-thumb">Görsel Yok</div>
                    <div class="product-info">
                        <div class="product-name">${prod.name}</div>
                        <div class="product-price">${prod.price}</div>
                    </div>
                `;
                pCard.onclick = () => openProductModal(prod);
                container.appendChild(pCard);
            });
        }

        function openProductModal(prod) {
            const modal = document.getElementById('product-modal');
            document.getElementById('modal-title').innerText = prod.name;
            document.getElementById('modal-desc').innerText = prod.desc;
            document.getElementById('modal-price').innerText = prod.price;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        function goBackToLanguages() {
            document.getElementById('categories-screen').classList.remove('active');
            document.getElementById('language-screen').classList.add('active');
        }

        function goBackToCategories() {
            document.getElementById('products-screen').classList.remove('active');
            document.getElementById('categories-screen').classList.add('active');
        }
    </script>
</body>
</html>
